# ============================================
# WEBSERV CONFIGURATION FILE
# ============================================
# This config tests ALL required features:
# - Multiple servers
# - Multiple locations
# - All directives (listen, server_name, error_page, 
#   client_max_body_size, root, index, allowed_methods,
#   cgi_path, upload_store, autoindex, return)
# ============================================

# ============================================
# SERVER 1: Main HTTP Server
# ============================================
server {
    # Basic server settings
    listen 8080;
    server_name localhost webserv.local;
    
    # Global settings (inherited by all locations unless overridden)
    client_max_body_size 10M;
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;
    
    # ==========================================
    # Location: Root (/)
    # ==========================================
    location / {
        root ./www;
        index index.html index.htm;
        allowed_methods GET POST;
        autoindex on;
    }
    
    # ==========================================
    # Location: Uploads
    # ==========================================
    location /uploads/ {
        root ./www;
        allowed_methods POST;
        upload_store ./www/uploads/tmp/;
        client_max_body_size 50M;
        autoindex off;
    }
    
    # ==========================================
    # Location: CGI Scripts (PHP)
    # ==========================================
    location /cgi-bin/ {
        root ./www;
        cgi_path /usr/bin/php-cgi;
        allowed_methods GET POST;
        autoindex off;
        client_max_body_size 5M;
    }
    
    # ==========================================
    # Location: Static Assets (no CGI)
    # ==========================================
    location /assets/ {
        root ./www;
        allowed_methods GET;
        autoindex off;
        client_max_body_size 1M;
    }
    
    # ==========================================
    # Location: Directory with no index (tests autoindex)
    # ==========================================
    location /files/ {
        root ./www;
        allowed_methods GET;
        autoindex on;
        index;
    }
    
    # ==========================================
    # Location: Redirect (bonus but good to have)
    # ==========================================
    location /old/ {
        return 301 /new/;
    }
}

# ============================================
# SERVER 2: API Server (different port)
# ============================================
server {
    listen 9090;
    server_name api.localhost;
    
    client_max_body_size 2M;
    error_page 404 /api/404.json;
    
    location /api/ {
        root ./www/api;
        index index.json;
        allowed_methods GET POST DELETE;
        autoindex off;
        
        # Python CGI for API endpoints
        cgi_path /usr/bin/python3;
    }
    
    location /api/upload/ {
        root ./www/api;
        allowed_methods POST;
        upload_store ./www/api/uploads/;
        client_max_body_size 25M;
    }
}

# ============================================
# SERVER 3: File Server (different hostname)
# ============================================
server {
    listen 8080;
    server_name files.webserv.local;
    
    client_max_body_size 100M;
    error_page 404 /errors/file_not_found.html;
    
    location / {
        root ./www/files;
        allowed_methods GET;
        autoindex on;
        index;
    }
    
    location /protected/ {
        root ./www/files;
        allowed_methods GET;
        autoindex off;
        # This tests that error_page can be location-specific
        error_page 403 /errors/forbidden.html;
    }
}

# ============================================
# SERVER 4: Minimal Server (tests defaults)
# ============================================
server {
    listen 8081;
    server_name minimal.local;
    
    location / {
        root ./www/minimal;
        index index.html;
        allowed_methods GET;
    }
}
