# ============================================
# MINIMAL WEBSERV CONFIGURATION
# ============================================
# Single server on port 8080
# Perfect for initial testing
# ============================================

server {
    # Basic settings
    listen 8080;
    server_name localhost;
    
    # Default error page
    error_page 404 /404.html;
    
    # Max upload size
    client_max_body_size 10M;
    
    # ==========================================
    # Root location
    # ==========================================
    location / {
        root ./www;
        index index.html;
        allowed_methods GET POST;
        autoindex on;
    }
    
    # ==========================================
    # Test CGI (if you have PHP/Python)
    # ==========================================
    location /cgi-bin/ {
        root ./www;
        cgi_path /usr/bin/python3;
        allowed_methods GET POST;
        autoindex off;
    }
    
    # ==========================================
    # Test uploads
    # ==========================================
    location /uploads/ {
        root ./www;
        allowed_methods POST;
        upload_store ./www/uploads/tmp/;
        client_max_body_size 50M;
        autoindex off;
    }
    
    # ==========================================
    # Test autoindex
    # ==========================================
    location /files/ {
        root ./www;
        allowed_methods GET;
        autoindex on;
        index;
    }
}
