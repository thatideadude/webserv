# ============================================
# WEBSERV - Multiple Ports Configuration
# ============================================

# ============================================
# SERVER 1: Port 8080 - Main Website
# ============================================
server {
    listen 8080;
    server_name localhost main.webserv.local;

    client_max_body_size 10M;
    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 500 www/errors/500.html;

    location / {
        root ./www;
        index index.html;
        allowed_methods GET POST HEAD DELETE;
        autoindex on;
    }

    location /files/ {
        root ./www;
        index index.html;
        allowed_methods GET POST HEAD DELETE;
        upload_store ./www/files/uploads/;
        autoindex on;
    }
}

# ============================================
# SERVER 2: Port 8081 - API Server
# ============================================
server {
    listen 8081;
    server_name api.webserv.local;
    
    client_max_body_size 50M;
    
    location / {
        root ./www/api;
        index index.html;
        allowed_methods GET HEAD;
        autoindex off;
    }
    
    location /upload/ {
        root ./www/api;
        allowed_methods POST HEAD;
        upload_store ./www/api/uploads/;
        client_max_body_size 50M;
        autoindex off;
    }
}

# ============================================
# SERVER 3: Port 8082 - File Server
# ============================================
server {
    listen 8082;
    server_name files.webserv.local;
    
    client_max_body_size 100M;
    
    location / {
        root ./www/files;
        allowed_methods GET HEAD;
        autoindex on;
        index;
    }
}

# ============================================
# SERVER 4: Port 8083 - CGI Server
# ============================================
server {
    listen 8083;
    server_name cgi.webserv.local;
    
    location / {
        root ./www;
        allowed_methods GET HEAD;
        autoindex off;
    }
    
    location /cgi-bin/ {
        root ./www;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php-cgi;
        allowed_methods GET POST HEAD;
        autoindex off;
    }
}
