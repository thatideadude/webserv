<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container error-container">
        <span class="error-code">500</span>
        <h1 class="error-title">500 - Internal Server Error</h1>
        <p class="error-desc">The server encountered an unexpected condition that prevented it from fulfilling the request.</p>

        <img src="https://httpmemes.com/500.jpg" alt="500 meme" class="memes">
        <br>
        <a href="/" class="error-btn">Go Home</a>

        <div class="info">
            Server: Webserv 42 Project • <span>/</span> localhost:8080
        </div>
    </div>
</body>
</html>
